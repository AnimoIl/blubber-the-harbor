<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B9F0FA" />
    <script>
      // Apply the saved ocean palette before the first paint.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem('blubber-ocean-mode');
        } catch {}
        const mode =
          saved === 'day' || saved === 'night'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'night'
              : 'day';
        document.documentElement.dataset.oceanMode = mode;
        document.querySelector('meta[name="theme-color"]').content =
          mode === 'night' ? '#102b41' : '#B9F0FA';
        let language;
        try {
          language = localStorage.getItem('blubber-language');
        } catch {}
        document.documentElement.lang = language === 'en' ? 'en' : 'vi';
      })();
    </script>
    <meta
      name="description"
      content="Một bến cảng nhỏ, một đại dương yêu thương. Ghé thăm thế giới của chú cá mập voi Blubber."
