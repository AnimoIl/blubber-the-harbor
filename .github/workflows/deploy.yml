name: Deploy Blubber's Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
        env:
          # Always use the live Pages path; repository variables can outlive a rename.
          VITE_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
      - name: Verify Pages asset paths
        env:
          PAGES_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';

          const base = process.env.PAGES_BASE_PATH;
          const html = readFileSync('dist/index.html', 'utf8');
          const assets = [...html.matchAll(/(?:src|href)="([^"]+)"/g)].map((match) => match[1]);
          assert(assets.some((url) => url.endsWith('.js')), 'Missing built JavaScript');
          assert(assets.some((url) => url.endsWith('.css')), 'Missing built stylesheet');
          for (const url of assets) {
            assert(url.startsWith(base), `Asset outside Pages base ${base}: ${url}`);
            assert(existsSync(`dist/${url.slice(base.length)}`), `Missing built asset: ${url}`);
          }
          console.log(`Verified ${assets.length} entry assets under ${base}`);
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
